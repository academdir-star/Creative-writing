<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мастерская письма — Skill Matrix</title>
  <meta name="description" content="Интерактивный курс creative writing для школьников 13–18 лет: короткие уроки с практикой, лаборатория стиля, мастерская эссе и портфолио.">
  <meta name="theme-color" content="#FBF7EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161B28" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Onest:wght@400..700&display=swap">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Перейти к содержанию</a>

  <header class="topbar" data-topbar>
    <div class="topbar__inner">
      <a class="brand" href="#/" data-brand>
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 3h10l-1 7-4 11-4-11z"/><path d="M12 12v9"/><circle cx="12" cy="10" r="1.4"/></svg>
        </span>
        <span class="brand__text">
          <span class="brand__name">Skill Matrix</span>
          <span class="brand__sub" data-i18n="app.name">Мастерская письма</span>
        </span>
      </a>

      <nav class="mainnav" aria-label="Main" data-mainnav></nav>

      <div class="topbar__tools">
        <div class="langswitch" role="group" aria-label="Language" data-langswitch>
          <button type="button" data-lang="ru">RU</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="iconbtn menu-toggle" type="button" aria-expanded="false" aria-controls="menu" data-menu-toggle>
          <span class="visually-hidden" data-i18n="nav.menu">Меню</span>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
    <div class="menu" id="menu" hidden data-menu></div>
  </header>

  <div class="storage-warning" hidden data-storage-warning></div>

  <main id="main" class="main" tabindex="-1" data-main></main>

  <nav class="tabbar" aria-label="Sections" data-tabbar></nav>

  <div class="toasts" aria-live="polite" data-toasts></div>
  <div class="modal" hidden data-modal>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__box" role="dialog" aria-modal="true" data-modal-box></div>
  </div>

  <noscript>
    <p class="noscript">Для работы мастерской письма нужен JavaScript. / The writing studio needs JavaScript.</p>
  </noscript>

  <!-- Core -->
  <script src="js/core/util.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/strings.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/text.js"></script>
  <script src="js/core/feedback.js"></script>
  <script src="js/content-api.js"></script>

  <!-- Content -->
  <script src="content/routes.js"></script>
  <script src="content/lessons-base.js"></script>
  <script src="content/lessons-free.js"></script>
  <script src="content/lessons-style.js"></script>
  <script src="content/lessons-story.js"></script>
  <script src="content/lessons-real.js"></script>
  <script src="content/lessons-contest.js"></script>
  <script src="content/lessons-admit.js"></script>
  <script src="content/lab.js"></script>
  <script src="content/library.js"></script>
  <script src="content/workshops-a.js"></script>
  <script src="content/workshops-b.js"></script>
  <script src="content/daily.js"></script>
  <script src="content/vocab.js"></script>
  <script src="content/essay.js"></script>
  <script src="content/teacher.js"></script>

  <!-- UI -->
  <script src="js/ui/ui.js"></script>
  <script src="js/ui/exercise.js"></script>
  <script src="js/ui/versions.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/routes.js"></script>
  <script src="js/views/lesson.js"></script>
  <script src="js/views/draft.js"></script>
  <script src="js/views/lab.js"></script>
  <script src="js/views/library.js"></script>
  <script src="js/views/portfolio.js"></script>
  <script src="js/views/essay.js"></script>
  <script src="js/views/workshops.js"></script>
  <script src="js/views/vocab.js"></script>
  <script src="js/views/daily.js"></script>
  <script src="js/views/teacher.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
